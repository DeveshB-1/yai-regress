[project]
name = "yai-regress"
version = "0.1.0"
description = "CI regression runner for Yellow.ai bots over the documented sync message API"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
yai-regress = "yai_regress.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yai_regress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
